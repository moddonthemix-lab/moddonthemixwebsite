<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Moddonthemix | Private project</title><style>body{background:#101114;color:#eee;font:16px system-ui;max-width:760px;margin:40px auto;padding:20px}h1,h2,a{color:#e5bf76}section{border:1px solid #383838;border-radius:12px;padding:20px;margin:16px 0}button,textarea{background:#222;color:#eee;border:1px solid #777;padding:12px;border-radius:6px;margin:5px}audio,textarea{width:95%}</style></head><body><h1>MODDONTHEMIX</h1><p>Private project workspace</p><p id="message"></p><main id="main"></main><script>const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const root=document.getElementById('main'),msg=document.getElementById('message');const el=(t,s)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;return n};async function call(action,query='',body){const r=await fetch('/api/review?action='+action+query,{headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},method:body?'POST':'GET',body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.json()).error);return r}async function load(){try{const d=await(await call('details')).json();root.replaceChildren(el('h2',d.project.service),el('p','Status: '+d.project.status+' · Payment: '+d.project.payment_status));if(d.finance)root.append(el('p','Balance: $'+((d.finance.quote_cents-d.finance.paid)/100).toFixed(2)));root.append(el('h2','Listen to your mix'));if(!d.versions.length){const empty=el('section');empty.append(el('h2','Awaiting your mix'),el('p','Your engineer has not published a preview yet. Return using your private link when your mix is ready.'));root.append(empty)}for(const [i,v] of d.versions.entries()){const box=el('section');box.append(el('h2','Mix version '+v.version_number));for(const kind of ['original','mixed','final'])if(v[kind]){const b=el('button',kind==='final'?'Download final audio':kind==='mixed'?'Play your mix':'Play original recording');const player=kind==='final'?null:el('audio');if(player){player.controls=true;player.preload='none';box.append(el('p',kind==='mixed'?'Professional mix':'Original recording'),player)}b.onclick=async()=>{b.disabled=true;try{const r=await call('audio','&version='+v.id+'&kind='+kind);if(Number(r.headers.get('Content-Length'))>250000000){await r.body.cancel();throw Error('File too large for browser download; contact your engineer.')}const blob=await r.blob(),url=URL.createObjectURL(blob);if(kind==='final'){const a=el('a');a.href=url;a.download=decodeURIComponent((r.headers.get('Content-Disposition')||'').split("UTF-8''")[1]||'final.wav');a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}else{if(player.src)URL.revokeObjectURL(player.src);player.src=url;await player.play().catch(()=>{});b.textContent='Reload preview'}}catch(e){msg.textContent=e.message}finally{b.disabled=false}};box.append(b)}if(v.decision)box.append(el('p',v.decision+': '+(v.notes||'')));else if(i===0){const notes=el('textarea');notes.placeholder='Revision notes';box.append(notes);for(const decision of ['approved','revision']){const b=el('button',decision==='approved'?'Approve mix':'Request revision');b.onclick=async()=>{if(!confirm('Submit this decision?'))return;try{await call('decision','&version='+v.id,{decision,notes:notes.value});await load()}catch(e){msg.textContent=e.message}};box.append(b)}}root.append(box)}}catch(e){msg.textContent=e.message}}load()</script></body></html>
