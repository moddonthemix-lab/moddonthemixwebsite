<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Moddonthemix | Private project</title><style>*{box-sizing:border-box}body{background:#101114;color:#eee;font:15px system-ui;max-width:900px;margin:0 auto;padding:32px 20px}h1,h2,a{color:#e5bf76}h1{letter-spacing:.12em;font-size:24px}h2{font-size:20px}p{line-height:1.6;color:#c3c4ca}section{background:#17191e;border:1px solid #34363c;border-radius:14px;padding:22px;margin:16px 0}button,textarea{font:inherit;background:#22252b;color:#eee;border:1px solid #50535b;padding:12px;border-radius:8px;margin:6px 6px 6px 0}button{cursor:pointer}button.primary{background:#e5bf76;color:#111;border-color:#e5bf76;font-weight:650}audio,textarea{width:100%}textarea{min-height:100px} .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat{background:#101216;padding:15px;border-radius:9px}.stat strong{display:block;color:#e5bf76;font-size:23px;margin-top:6px}.steps{display:flex;flex-wrap:wrap;gap:8px}.step{padding:8px 12px;border:1px solid #444;border-radius:20px;color:#aaa}.step.current{color:#e5bf76;border-color:#e5bf76}.notice{border-left:3px solid #e5bf76;padding-left:14px}#message{color:#e5bf76}header{border-bottom:1px solid #333;padding-bottom:12px}button:disabled{opacity:.5}@media(max-width:480px){body{padding:16px}section{padding:15px}}</style></head><body><header><h1>MODDONTHEMIX</h1><p>Private project workspace · Mixing & mastering</p></header><p id="message"></p><main id="main"></main><script>const token=location.hash.slice(1),root=document.getElementById('main'),msg=document.getElementById('message');const el=(t,s)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;return n};const money=n=>'$'+(n/100).toFixed(2);async function req(path,body){const r=await fetch(path,{headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},method:body?'POST':'GET',body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error((await r.json()).error);return r}const review=(action,q='',body)=>req('/api/review?action='+action+q,body);function button(label,fn,primary=false){const b=el('button',label);if(primary)b.className='primary';b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){msg.textContent=e.message}finally{b.disabled=false}};return b}async function load(){try{const d=await(await review('details')).json(),latest=d.versions[0],released=d.versions.some(v=>v.final&&v.final_name);const payment=await(await req('/api/stripe/status')).json().catch(()=>null);const testPaid=payment&&!payment.live?payment.paid:0;const balance=d.finance?Math.max(0,d.finance.quote_cents-d.finance.paid-testPaid):null;const paid=balance===0&&d.finance?.quote_cents>0;root.replaceChildren();const overview=el('section');overview.append(el('h2',d.project.service),el('p','Status: '+(released?'Final delivery':latest?.decision|| (latest?'Ready for review':d.project.status))));const stats=el('div');stats.className='stats';for(const [k,v] of [['Project total',d.finance?money(d.finance.quote_cents):'Awaiting quote'],['Balance due',d.finance?money(balance):'Awaiting quote'],['Revisions remaining',String(d.revisions.remaining)],['Payment',paid?(payment&&!payment.live?'Paid (test)':'Paid'):d.project.payment_status]]){const n=el('div');n.className='stat';n.append(el('small',k),el('strong',v));stats.append(n)}overview.append(stats);root.append(overview);const pay=el('section');pay.append(el('h2','Project payments'));try{const s=payment;if(!s)throw Error('Payment status unavailable');if(!s.live)pay.append(el('p','Sandbox only — no real charges. Verified test payments: '+money(s.paid)));if(d.finance&&d.finance.quote_cents>d.finance.paid&&d.project.payment_status!=='paid'&&(s.live||s.paid<d.finance.quote_cents-d.finance.paid))pay.append(button(s.live?'Pay securely with Stripe':'Pay now — test mode',async()=>{const c=await(await req('/api/stripe/checkout',{})).json();location.assign(c.url)},true));if(paid)pay.append(el('p',s.live?'Payment confirmed. Thank you.':'Test payment confirmed. No real money charged.'));for(const receipt of s.receipts||[]){pay.append(button('Download '+(s.live?'':'test ')+'receipt',()=>{const a=el('a');const body=['MODDONTHEMIX',s.live?'Payment receipt':'TEST RECEIPT — NOT A REAL PAYMENT','Reference: '+receipt.id,'Amount: '+money(receipt.amount),'Refunded: '+money(receipt.refunded),'Recorded: '+receipt.created_at+' UTC'].join('\n');const url=URL.createObjectURL(new Blob([body],{type:'text/plain'}));a.href=url;a.download='moddonthemix-receipt-'+receipt.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}))}pay.append(button('Refresh payment status',load))}catch(e){pay.append(el('p',e.message))}root.append(pay);const updates=el('section');updates.append(el('h2','Project updates'),el('p',released?'Final files ready.':latest?.decision==='approved'?'Approval received.':latest?.decision==='revision'?'Revision request received.':latest?'Mix version '+latest.version_number+' ready for listening.':'Awaiting first preview.'));root.append(updates);for(const [i,v] of d.versions.entries()){const box=el('section');box.append(el('h2','Mix version '+v.version_number));for(const kind of ['original','mixed','final'])if(v[kind]){const player=kind==='final'?null:el('audio');if(player){player.controls=true;box.append(el('p',kind==='mixed'?'Professional mix':'Original recording'),player)}box.append(button(kind==='final'?'Download '+(v.final_name||'final file'):'Load '+kind+' audio',async()=>{if(kind==='final'&&window.showSaveFilePicker){const h=await window.showSaveFilePicker({suggestedName:v.final_name||'final'});const r=await review('audio','&version='+v.id+'&kind='+kind);await r.body.pipeTo(await h.createWritable());return}const r=await review('audio','&version='+v.id+'&kind='+kind);if(Number(r.headers.get('Content-Length'))>250000000){await r.body.cancel();throw Error('Use desktop Chrome or Edge for large final files.')}const blob=await r.blob(),url=URL.createObjectURL(blob);if(player){if(player.src)URL.revokeObjectURL(player.src);player.src=url;await player.play().catch(()=>{})}else{const a=el('a');a.href=url;a.download=v.final_name||'final';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}}))}if(v.decision)box.append(el('p',v.decision+': '+(v.notes||'')));else if(i===0){const notes=el('textarea');notes.placeholder='Revision notes';box.append(notes,button('Approve mix',async()=>{if(confirm('Approve this mix?')){await review('decision','&version='+v.id,{decision:'approved',notes:notes.value});await load()}},true));if(d.revisions.remaining)box.append(button('Request revision',async()=>{await review('decision','&version='+v.id,{decision:'revision',notes:notes.value});await load()}));else box.append(el('p','Revision allowance exhausted. Contact your engineer for additional revisions.'))}root.append(box)}}catch(e){msg.textContent=e.message}}load();if(new URLSearchParams(location.search).get('payment')==='return'){let n=0;const timer=setInterval(()=>{if(++n>=6)clearInterval(timer);load()},3000)}</script></body></html>
